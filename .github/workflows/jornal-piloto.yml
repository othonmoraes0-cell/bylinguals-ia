name: Piloto do Jornal (IA grátis)

# Só para avaliar (09/10/2026): escreve 4 notícias de fontes abertas em 2 níveis com um modelo aberto, no processador.
# Não mexe no Portal. O resultado fica no resumo da execução e no artefato "piloto-<modelo>".
on:
  workflow_dispatch:

permissions:
  contents: write # grava o resultado no ramo "piloto-jornal" (só texto, para a equipe ler)

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: qwen2.5-7b
            url: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ferramentas
        run: pip install trafilatura==1.12.2
      - name: llama.cpp (compilado aqui, só o servidor)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama
          cmake -S llama -B llama/build -DLLAMA_CURL=OFF -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build llama/build --target llama-server -j "$(nproc)" > /dev/null
          ls -la llama/build/bin/llama-server
      - name: Modelo (cache)
        uses: actions/cache@v4
        with:
          path: modelo.gguf
          key: gguf-${{ matrix.rotulo }}
      - name: Baixar o modelo
        run: test -s modelo.gguf || curl -sSL -o modelo.gguf "${{ matrix.url }}"; ls -lh modelo.gguf
      - name: Escrever as notícias
        env:
          MODELO_ROTULO: ${{ matrix.rotulo }}
        run: |
          SERVER=llama/build/bin/llama-server
          nproc; free -g
          "$SERVER" -m modelo.gguf -c 6144 -t $(nproc) --port 8080 > servidor.log 2>&1 &
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 2; done
          curl -s localhost:8080/health
          python robo/jornal_piloto.py
      - name: Registro do servidor
        if: always()
        run: tail -n 30 servidor.log || true
      - name: Guardar o resultado no ramo piloto-jornal
        if: always()
        run: |
          mkdir -p saida && cp piloto/resultado.md "saida/v2-${{ matrix.rotulo }}.md" 2>/dev/null || echo "sem resultado" > "saida/v2-${{ matrix.rotulo }}.md"
          cp piloto/resultado.json "saida/v2-${{ matrix.rotulo }}.json" 2>/dev/null || true
          tail -n 40 servidor.log > "saida/${{ matrix.rotulo }}-servidor.log" 2>/dev/null || true
          git config user.name "robo-bylinguals" && git config user.email "robo@users.noreply.github.com"
          for tentativa in 1 2 3 4 5; do
            rm -rf ramo && git fetch -q origin piloto-jornal 2>/dev/null && git worktree add -q ramo FETCH_HEAD 2>/dev/null || { git worktree add -q --detach ramo && (cd ramo && git checkout -q --orphan tmp && git rm -rqf . 2>/dev/null || true); }
            cp saida/* ramo/ && (cd ramo && git add -A && git commit -qm "Piloto: ${{ matrix.rotulo }}" && git push -q origin HEAD:piloto-jornal) && break
            git worktree remove --force ramo || true; sleep $((tentativa * 7))
          done
