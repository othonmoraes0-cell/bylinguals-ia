name: Jornal do Club (The Bylinguals Daily)

# Escreve a edição do dia com um modelo aberto (Qwen2.5 14B, grátis, no processador do GitHub) e entrega ao Portal.
# Fontes: só título e resumo dos feeds (NYT, CNN Brasil, BBC, Guardian, DW, NPR, g1) + matéria inteira da NASA (domínio
# público). Só entra assunto com 3+ veículos (ou da NASA) e cada frase passa por conferência. Nada de foto de jornal.
# Se o Portal já tem a edição do dia, o robô para logo no começo (o Portal também pode chamar este fluxo).
on:
  schedule:
    - cron: "17 6 * * *" # 3h17 em São Paulo
  workflow_dispatch:
    inputs:
      forcar:
        description: "Escrever mesmo que a edição de hoje já exista (as notícias sem respostas são trocadas)"
        type: boolean
        default: false
      seco:
        description: "Só testar: escreve e mostra no resumo, sem entregar ao Portal"
        type: boolean
        default: false
      dia:
        description: "Dia da edição (AAAA-MM-DD). Vazio = hoje"
        required: false
        default: ""
      maximo:
        description: "Quantas notícias no máximo"
        required: false
        default: "14"

permissions:
  id-token: write # token OIDC: é assim que o Portal sabe que é este robô (sem senha)
  contents: write # só no teste seco: grava o resultado no ramo "piloto-jornal" para a equipe ler

concurrency:
  group: jornal-do-club
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.bylinguals.com.br' }}
      FORCAR: ${{ inputs.forcar || 'false' }}
      SECO: ${{ inputs.seco || 'false' }}
      DIA: ${{ inputs.dia }}
      MAXIMO: ${{ inputs.maximo || '14' }}
      MODELO_ROTULO: qwen2.5-14b
    steps:
      - uses: actions/checkout@v4

      - name: Já tem edição hoje?
        id: hoje
        run: |
          if [ "$FORCAR" = "true" ] || [ "$SECO" = "true" ]; then echo "fazer=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          DIA_Q=${DIA:-$(TZ=America/Sao_Paulo date +%F)}
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bylinguals-portal" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          STATUS=$(curl -sS -o hoje.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$SITE_URL/api/robo/jornal?dia=$DIA_Q") || STATUS=000
          echo "HTTP $STATUS $(cat hoje.json 2>/dev/null)"
          if [ "$STATUS" = "200" ] && grep -q '"existe":true' hoje.json; then echo "::notice title=Jornal::A edição de $DIA_Q já está no Portal"; echo "fazer=nao" >> "$GITHUB_OUTPUT"; else echo "fazer=sim" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.hoje.outputs.fazer == 'sim'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: robo/requirements*.txt

      - name: Ferramentas
        if: steps.hoje.outputs.fazer == 'sim'
        run: |
          pip install -q trafilatura==1.12.2 requests==2.32.3
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r robo/requirements-traducao.txt

      - name: llama.cpp (compilado aqui, só o servidor)
        if: steps.hoje.outputs.fazer == 'sim'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama
          cmake -S llama -B llama/build -DLLAMA_CURL=OFF -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build llama/build --target llama-server -j "$(nproc)" > /dev/null
          ls -la llama/build/bin/llama-server

      # Sem cache de propósito: o modelo (9 GB) tiraria do cache os modelos do robô de legendas.
      - name: Baixar o modelo
        if: steps.hoje.outputs.fazer == 'sim'
        run: |
          curl -sSL --retry 3 -o modelo.gguf "https://huggingface.co/bartowski/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf"
          ls -lh modelo.gguf

      - name: Escrever a edição
        if: steps.hoje.outputs.fazer == 'sim'
        run: |
          llama/build/bin/llama-server -m modelo.gguf -c 6144 -t $(nproc) --port 8080 > servidor.log 2>&1 &
          for i in $(seq 1 150); do curl -s localhost:8080/health | grep -q ok && break; sleep 2; done
          curl -s localhost:8080/health; echo
          python robo/jornal.py

      - name: Registro do servidor
        if: failure()
        run: tail -n 40 servidor.log || true

      - name: Teste seco → ramo piloto-jornal
        if: always() && env.SECO == 'true'
        run: |
          mkdir -p saida && cp servidor.log saida/servidor.log 2>/dev/null || true
          git config user.name "robo-bylinguals" && git config user.email "robo@users.noreply.github.com"
          git fetch -q origin piloto-jornal && git worktree add -q ramo FETCH_HEAD
          mkdir -p ramo/seco && cp saida/edicao.md ramo/seco/edicao.md 2>/dev/null || echo "sem resultado" > ramo/seco/edicao.md
          cp saida/edicao.json ramo/seco/edicao.json 2>/dev/null || true
          tail -n 40 saida/servidor.log > ramo/seco/servidor.log 2>/dev/null || true
          cd ramo && git add -A && git commit -qm "Teste seco do Jornal" && git push -q origin HEAD:piloto-jornal
