name: Robô de IA

# Pergunta ao Portal se há legenda ou sincronia para fazer. Repositório público: os minutos do GitHub Actions são grátis.
on:
  schedule:
    - cron: "4 * * * *" # de hora em hora (10/10/2026): cada consulta acorda o banco (Neon grátis: 100 h de compute por mês); o Portal chama o robô na hora quando entra tarefa
  workflow_dispatch:
    inputs:
      url_de_teste:
        description: "Só para testar o robô: link de um áudio/vídeo (não mexe no Portal)"
        required: false
        default: ""
      testar_chamada:
        description: "Só para testar: o Portal tenta chamar o robô (confere a chave ROBO_DISPARO_TOKEN da Vercel)"
        type: boolean
        default: false
      traducao_de_teste:
        description: "Só para testar o tradutor do guia: palavras ou frases separadas por | (não mexe no Portal)"
        required: false
        default: ""

permissions:
  id-token: write # token OIDC: é assim que o Portal sabe que é este robô (sem senha)
  contents: read

# Um robô por vez: se uma rodada demora (um filme inteiro), a próxima espera.
concurrency:
  group: robo-de-ia
  cancel-in-progress: false

jobs:
  trabalhar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.bylinguals.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tem trabalho?
        id: fila
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bylinguals-portal" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          Q=""; if [ "${{ inputs.testar_chamada }}" = "true" ]; then Q="?testar=1"; fi
          STATUS=$(curl -sS -o fila.json -w "%{http_code}" -X GET -H "Authorization: Bearer $TOKEN" "$SITE_URL/api/robo/tarefas/fila$Q") || STATUS=000
          echo "HTTP $STATUS"; cat fila.json || true; echo
          echo "::notice title=Portal::HTTP $STATUS $(head -c 400 fila.json 2>/dev/null)"
          if [ -n "${{ inputs.url_de_teste }}${{ inputs.traducao_de_teste }}" ]; then echo "trabalho=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$STATUS" = "200" ] && grep -q '"pendentes":0' fila.json; then echo "trabalho=nao" >> "$GITHUB_OUTPUT"; else echo "trabalho=sim" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.trabalho == 'sim'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: robo/requirements*.txt

      - name: Modelos de IA (cache)
        if: steps.fila.outputs.trabalho == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-v2-${{ hashFiles('robo/requirements*.txt') }}
          restore-keys: |
            whisper-modelos-v1

      - name: Preparar
        if: steps.fila.outputs.trabalho == 'sim'
        run: |
          (command -v ffmpeg >/dev/null) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          # Tudo junto e de uma vez (whisper e tradutor), para nenhuma biblioteca trocar de versão no meio da rodada.
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r robo/requirements.txt -r robo/requirements-traducao.txt
          python -c "import faster_whisper, transformers, huggingface_hub, tokenizers; print('bibliotecas ok', huggingface_hub.__version__, tokenizers.__version__, transformers.__version__)"

      - name: Trabalhar
        if: steps.fila.outputs.trabalho == 'sim'
        env:
          URL_DE_TESTE: ${{ inputs.url_de_teste }}
          TRADUCAO_DE_TESTE: ${{ inputs.traducao_de_teste }}
        run: python robo/robo.py

  # O GitHub desliga agendamentos de repositório sem movimento há 60 dias: um commit vazio por mês mantém o robô vivo.
  manter-vivo:
    if: github.event.schedule == '4,19,34,49 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensal
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ULTIMO )) -gt $(( 30 * 24 * 3600 )) ]; then
            git config user.name "robo-bylinguals" && git config user.email "robo@users.noreply.github.com"
            git commit --allow-empty -m "Manter o robô agendado [skip ci]" && git push
          fi
